<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mã hóa và giải mã văn bản hoặc file. Chọn thuật toán để bắt đầu với Cipher Workbench."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/barlow/Barlow-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/barlow/BarlowCondensed-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Apply the saved theme before first paint, without a blocking network request.
      (function () {
        let storedTheme;
        try {
          storedTheme = window.localStorage.getItem("cipher-workbench-theme");
        } catch {
          storedTheme = null;
        }
        document.documentElement.dataset.theme =
          storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <title>Cipher Workbench | Encode and Decode</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
