services:
  app:
    image: cipher-workbench-public:local
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-development}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-18081}:8000"
    restart: unless-stopped
    environment:
      PORT: "8000"
      PUBLIC_MODE: "true"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
