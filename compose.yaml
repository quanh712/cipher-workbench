services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-development}
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      PUBLIC_MODE: "true"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
