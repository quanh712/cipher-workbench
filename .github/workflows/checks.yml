name: Checks
on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_call:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run test -- --maxWorkers=2
      - run: npm run build
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          require-checksums: true
          python-version: '3.12.16'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --no-emit-project --output-file /tmp/requirements.audit.txt
          uv tool run --from pip-audit==2.10.1 pip-audit -r /tmp/requirements.audit.txt --no-deps --disable-pip --require-hashes --progress-spinner off
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python -m unittest discover -s ../deploy/tests -v
